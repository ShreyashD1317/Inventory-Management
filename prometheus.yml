global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'inventory-management-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Inventory Management API
  - job_name: 'inventory-api'
    scrape_interval: 10s
    static_configs:
      - targets: ['inventory-api:3000']
    metrics_path: '/metrics'
    
  # Node.js application metrics
  - job_name: 'nodejs-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['inventory-api:3000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'inventory-management-api'